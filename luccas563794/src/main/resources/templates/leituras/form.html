<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leitura</title>
</head>
<body>
    <a th:href="@{/}">Início</a> | <a th:href="@{/bairros}">Bairros</a> | <a th:href="@{/trechos}">Trechos</a> | <a th:href="@{/leituras}">Leituras</a>

    <h1 th:text="${leitura.id == null} ? 'Nova leitura' : 'Editar leitura'"></h1>

    <form th:action="@{/leituras/salvar}" th:object="${leitura}" method="post">
        <input type="hidden" th:field="*{id}">

        <p>
            <label>Trecho
                <select th:field="*{trechoId}">
                    <option value="">Selecione...</option>
                    <option th:each="t : ${trechos}" th:value="${t.id}" th:text="${t.logradouro} + ' (' + ${t.bairroNome} + ')'"></option>
                </select>
            </label>
            <span th:if="${#fields.hasErrors('trechoId')}" th:errors="*{trechoId}" style="color:orangered"></span>
        </p>
        <p>
            <label>Data e hora
                <input type="datetime-local" th:field="*{dataHora}">
            </label>
            <span th:if="${#fields.hasErrors('dataHora')}" th:errors="*{dataHora}" style="color:orangered"></span>
        </p>
        <p>
            <label>Lâmina (cm)
                <input type="number" th:field="*{laminaCm}">
            </label>
            <span th:if="${#fields.hasErrors('laminaCm')}" th:errors="*{laminaCm}" style="color:orangered"></span>
        </p>

        <button type="submit">Salvar</button>
        <a th:href="@{/leituras}">Cancelar</a>
    </form>
</body>
</html>
