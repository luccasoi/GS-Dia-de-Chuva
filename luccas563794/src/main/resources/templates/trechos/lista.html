<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trechos</title>
</head>
<body>
    <a th:href="@{/}">Início</a> | <a th:href="@{/bairros}">Bairros</a> | <a th:href="@{/trechos}">Trechos</a> | <a th:href="@{/leituras}">Leituras</a>

    <h1>Trechos de calçada</h1>
    <p th:if="${erro != null}" th:text="${erro}" style="color:orangered"></p>
    <a th:href="@{/trechos/novo}">Novo trecho</a>

    <table border="1">
        <tr>
            <th>Logradouro</th>
            <th>Bairro</th>
            <th>Tipo de calçada</th>
            <th>Altitude (m)</th>
            <th>Ações</th>
        </tr>
        <tr th:each="t : ${trechos}">
            <td th:text="${t.logradouro}"></td>
            <td th:text="${t.bairroNome}"></td>
            <td th:text="${t.tipoCalcada}"></td>
            <td th:text="${t.altitude}"></td>
            <td>
                <a th:href="@{/trechos/{id}/editar(id=${t.id})}">Editar</a>
                <form th:action="@{/trechos/{id}/excluir(id=${t.id})}" method="post" style="display:inline">
                    <button type="submit">Excluir</button>
                </form>
            </td>
        </tr>
    </table>
</body>
</html>
